version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "actions/*"
      security-actions:
        patterns:
          - "github/codeql-action"
          - "actions/dependency-review-action"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "drhiidden"
    assignees:
      - "drhiidden"
    target-branch: "main"
    versioning-strategy: increase

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "npm"
      include: "scope" 